[package]
name = "telegram-mcp-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "MCP server and Telegram tools"

[dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-async-rw"] }
serde_json = "1"
telegram-mcp-core = { path = "../core" }
telegram-mcp-ipc = { path = "../ipc" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["client"] }

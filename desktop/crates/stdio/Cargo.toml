[package]
name = "telegram-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "stdio shim that connects MCP clients to the tray"

[lib]
name = "telegram_mcp_stdio"
path = "src/lib.rs"

[[bin]]
name = "telegram-mcp"
path = "src/main.rs"

[dependencies]
telegram-mcp-ipc = { path = "../ipc" }
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

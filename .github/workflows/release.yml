name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Install Tauri CLI 2.12.4
        run: cargo install tauri-cli --version 2.12.4 --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: Telegram MCP v__VERSION__
          releaseBody: |
            Скачивайте файл, у которого в списке написано «Скачать». Остальные файлы на странице не нужны.

            Mac с Apple Silicon и Mac Intel — это разные DMG. Windows — файл EXE. DMG откройте и перетащите Telegram MCP в «Программы». EXE запустите. При первом запуске система может написать, что разработчик не опознан.

            В окне приложения введите api_id и api_hash с my.telegram.org, отсканируйте QR и нажмите «Подключить» у нужного клиента. После этого клиент нужно полностью перезапустить.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          retryAttempts: 3
          args: ${{ matrix.args }}

  label:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Label the files a person should download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | [.id, .name] | @tsv' |
            while IFS="$(printf '\t')" read -r id name; do
              case "$name" in
                *aarch64.dmg) label="Скачать: Mac Apple Silicon" ;;
                *x64.dmg) label="Скачать: Mac Intel" ;;
                *setup.exe) label="Скачать: Windows" ;;
                *.app.tar.gz) label="Не скачивать: архив без установщика" ;;
                *.msi) label="Не скачивать: второй установщик Windows" ;;
                *) continue ;;
              esac
              gh api --method PATCH -f label="$label" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" >/dev/null
            done
